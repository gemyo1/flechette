<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fléchettes caméra</title>
<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#1c1c1a;--mu:#6b6a63;--ac:#c8372d;--ok:#1f8a4c;--bd:#d9d5c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--sf:#22221f;--tx:#f0eee6;--mu:#9a988e;--ac:#e5584d;--ok:#4cc27f;--bd:#3a3a35}}
:root[data-theme="dark"]{--bg:#151513;--sf:#22221f;--tx:#f0eee6;--mu:#9a988e;--ac:#e5584d;--ok:#4cc27f;--bd:#3a3a35}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at top,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--bg) 65%) fixed;color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:10px;max-width:560px;margin:auto}
h1{font-size:24px;margin:6px 0 12px;text-align:center;background:linear-gradient(90deg,var(--ac),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--ac);box-shadow:0 3px 12px rgba(0,0,0,.1);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:6px}
button{font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
button.pri{background:linear-gradient(135deg,var(--ac),#e8892b);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.seg button{flex:1}.seg button.on{background:var(--ok);border-color:var(--ok);color:#fff}
#wrap{position:relative;background:#000;border-radius:12px;box-shadow:0 0 0 3px var(--ac);overflow:hidden;margin:0 auto 8px;width:100%;aspect-ratio:4/3}
#vid,#cv,#pimg{position:absolute;inset:0;width:100%;height:100%}
#cv{touch-action:none}
#pl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.p{flex:1 1 80px;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--sf);text-align:center}
.p.on{border-color:var(--ac);background:var(--ac);color:#fff}.p.on small{color:#ffe9e6}.p small{display:block;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p b{font-size:28px}
#ds{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.c{min-width:52px;text-align:center;padding:8px;border-radius:8px;background:#f2c230;color:#1c1c1a;border:none;font-weight:700}
#msg{text-align:center;font-size:14px;margin:6px 0;min-height:20px}
#cal{display:none}
.hide{display:none}
</style></head><body>
<h1>🎯 Fléchettes caméra</h1>

<div id="setup" class="card">
  <label>Mode</label>
  <div class="row seg" id="modeSeg"><button data-v="301">301</button><button data-v="501" class="on">501</button><button data-v="701">701</button><button data-v="cricket">Cricket</button></div>
  <label>Sortie</label>
  <div class="row seg" id="outSeg"><button data-v="1" class="on">Double out</button><button data-v="0">Sortie libre</button></div>
  <label>Joueurs</label>
  <input type="text" id="n0" placeholder="Joueur 1" value="Joueur 1">
  <input type="text" id="n1" placeholder="Joueur 2 (optionnel)" value="Joueur 2">
  <input type="text" id="n2" placeholder="Joueur 3 (optionnel)">
  <input type="text" id="n3" placeholder="Joueur 4 (optionnel)"><div id="more"></div><button id="addP" style="width:100%;margin-bottom:6px">+ Ajouter un joueur</button>
  <button class="pri" id="go" style="width:100%;margin-top:6px">Commencer et activer la caméra</button>
  <p style="font-size:13px;color:var(--mu)">Posez le téléphone face à la cible, bien droit et immobile, avec un bon éclairage.</p>
</div>

<div id="game" class="hide">
  <div id="wrap"><video id="vid" muted playsinline autoplay></video><img id="pimg" alt="" style="display:none"><canvas id="cv"></canvas></div>
  <div id="cal" class="card">
    <small style="color:var(--mu)">Glissez sur l’image pour centrer le repère sur le milieu de la cible, puis réglez la taille (anneau double extérieur) et la rotation (le 20 en haut).</small>
    <label>Taille</label><input type="range" id="rs" min="0.1" max="0.6" step="0.002" style="width:100%">
    <label>Rotation</label><input type="range" id="rr" min="-20" max="20" step="0.5" style="width:100%">
  </div>
  <div id="pl"></div>
  <div id="ds"></div>
  <div id="msg"></div>
  <div class="row" style="margin-bottom:8px">
    <button id="bCal">Calibrer</button>
    <button id="bArm" class="pri">Lancer la détection</button>
    <button id="bMan">Saisie manuelle</button><button id="bPhoto" style="display:none">Photo</button><input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none">
  </div>
  <div class="row">
    <button id="bUndo">Annuler</button>
    <button id="bNext" class="pri">Joueur suivant</button>
    <button id="bQuit">Quitter</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const cfg={x:.5,y:.5,r:.35,rot:0};
let G={players:[],cur:0,mode:501,dout:true,darts:[],start:501,bust:false,win:false};
let camErr='',photoMode=false,armed=false,manual=false,calib=true,ref=null,prev=null,st='idle',still=0,timer=null,stream=null;
const vid=$('vid'),cv=$('cv'),wrap=$('wrap');
const off=document.createElement('canvas');

function seg(id){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
seg('modeSeg');seg('outSeg');

$('go').onclick=async()=>{
  const names=[...document.querySelectorAll('#setup input[type=text]')].map(i=>i.value.trim()).filter(Boolean);
  if(!names.length)names.push('Joueur 1');
  const mv=$('modeSeg').querySelector('.on').dataset.v;G.cricket=mv=='cricket';G.mode=G.cricket?0:+mv;
  G.dout=$('outSeg').querySelector('.on').dataset.v=='1';
  G.players=names.map(n=>({name:n,rem:G.mode,marks:{15:0,16:0,17:0,18:0,19:0,20:0,25:0},pts:0}));snap();
  G.cur=0;G.start=G.mode;G.darts=[];G.bust=G.win=false;
  $('setup').classList.add('hide');$('game').classList.remove('hide');
  calib=true;$('cal').style.display='block';$('rs').value=cfg.r;$('rr').value=cfg.rot;
  await startCam();render();
};

async function startCam(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'API caméra absente'};
    const to=new Promise((_,j)=>setTimeout(()=>j({name:'aucune réponse du navigateur'}),6000));
    stream=await Promise.race([navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}),to]);
    vid.srcObject=stream;vid.play().catch(()=>{});
    vid.onloadedmetadata=fit;if(vid.videoWidth)fit();
  }catch(e){
    manual=true;$('bMan').classList.add('pri');
    camErr='Caméra bloquée ('+(e&&e.name||'erreur')+'). Touchez « Photo » pour scorer avec des photos prises sans bouger le téléphone, ou placez les fléchettes à la main.';$('bPhoto').style.display='';render();
  }
}
function fit(){const r=vid.videoWidth/vid.videoHeight;wrap.style.aspectRatio=r;wrap.style.width='min(100%,'+(52*r)+'vh)';draw()}
new ResizeObserver(()=>draw()).observe(wrap);

/* ---------- scoring ---------- */
function hit(nx,ny){
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const dx=(nx-cfg.x)*W,dy=(ny-cfg.y)*H;
  const d=Math.hypot(dx,dy)/(cfg.r*W)*170;
  if(d<6.35)return{pts:50,dbl:true,label:'50',x:nx,y:ny};
  if(d<15.9)return{pts:25,dbl:false,label:'25',x:nx,y:ny};
  if(d>170)return{pts:0,dbl:false,label:'0',x:nx,y:ny};
  let a=Math.atan2(dx,-dy)*180/Math.PI-cfg.rot;a=((a%360)+360)%360;
  const s=ORDER[Math.floor(((a+9)%360)/18)];
  if(d>=99&&d<=107)return{pts:s*3,dbl:false,label:'T'+s,x:nx,y:ny};
  if(d>=162)return{pts:s*2,dbl:true,label:'D'+s,x:nx,y:ny};
  return{pts:s,dbl:false,label:''+s,x:nx,y:ny};
}
function calc(){
  if(G.cricket)return calcCk();let rem=G.start,bust=false,win=false;
  for(const d of G.darts){
    const t=rem-d.pts;
    if(t<0||(G.dout&&t==1)||(t==0&&G.dout&&!d.dbl)){bust=true;break}
    rem=t;if(t==0){win=true;break}
  }
  G.bust=bust;G.win=win;G.players[G.cur].rem=bust?G.start:rem;
}
function addDart(d){
  if(G.darts.length>=3||G.bust||G.win)return;
  G.darts.push(d);calc();
  if(G.darts.length>=3||G.bust||G.win){armed=false;stopLoop();$('bArm').textContent='Lancer la détection'}
  render();
}

/* ---------- UI ---------- */
function snap(){G.snap=G.players.map(p=>({m:{...p.marks},pts:p.pts}))}
function calcCk(){
  G.players.forEach((p,i)=>{p.marks={...G.snap[i].m};p.pts=G.snap[i].pts});
  G.bust=false;G.win=false;const me=G.players[G.cur];
  for(const d of G.darts){
    const L=d.label;let n,m;
    if(L=='0')continue;
    if(L=='50'){n=25;m=2}else if(L=='25'){n=25;m=1}
    else if(L[0]=='T'){n=+L.slice(1);m=3}else if(L[0]=='D'){n=+L.slice(1);m=2}else{n=+L;m=1}
    if(!(n in me.marks))continue;
    for(let k=0;k<m;k++){
      if(me.marks[n]<3)me.marks[n]++;
      else if(G.players.some((q,j)=>j!=G.cur&&q.marks[n]<3))me.pts+=n;
    }
    if(Object.values(me.marks).every(v=>v>=3)&&G.players.every((q,j)=>j==G.cur||me.pts>=q.pts)){G.win=true;break}
  }
}
function ckHtml(){
  const N=[20,19,18,17,16,15,25],S=['·','/','✕','⊗'];
  return '<table style="width:100%;border-collapse:collapse;text-align:center"><tr><td></td>'+
  G.players.map((p,i)=>'<td style="padding:4px;border-bottom:2px solid '+(i==G.cur?'var(--ac)':'var(--bd)')+'"><small style="color:var(--mu)">'+esc(p.name)+'</small><br><b style="font-size:22px">'+p.pts+'</b></td>').join('')+'</tr>'+
  N.map(n=>'<tr><td style="color:var(--mu);font-size:13px">'+(n==25?'B':n)+'</td>'+G.players.map(p=>'<td style="font-size:20px;padding:2px;color:'+(p.marks[n]>=3?'var(--ok)':'var(--tx)')+'">'+S[p.marks[n]]+'</td>').join('')+'</tr>').join('')+'</table>';
}
function render(){
  const P=G.players;
  $('pl').innerHTML=G.cricket?ckHtml():P.map((p,i)=>'<div class="p '+(i==G.cur?'on':'')+'"><small>'+esc(p.name)+'</small><b>'+p.rem+'</b></div>').join('');
  $('ds').innerHTML=[0,1,2].map(i=>'<span class="c">'+(G.darts[i]?G.darts[i].label:'·')+'</span>').join('');
  const nm=esc(P[G.cur].name);let m;
  if(G.win)m='🎯 '+nm+' gagne la partie !';
  else if(G.bust)m='Bust ! Le score revient à '+G.start+' pour ce tour.';
  else if(G.darts.length>=3)m='Retirez vos fléchettes puis touchez « Joueur suivant ».';
  else if(armed)m='Détection en cours… lancez !';
  else if(manual)m='Touchez la cible pour placer une fléchette.';
  else m='Réglez le repère, puis « Lancer la détection ».';
  if(camErr&&!stream&&!G.win&&!G.bust&&G.darts.length<3)m=camErr;$('msg').innerHTML=m;
  $('bNext').textContent=G.win?'Nouvelle partie':'Joueur suivant';
  draw();
}
function draw(){
  const w=cv.width=wrap.clientWidth,h=cv.height=wrap.clientHeight;if(!w)return;
  const x=cv.getContext('2d');x.clearRect(0,0,w,h);
  const cx=cfg.x*w,cy=cfg.y*h,R=cfg.r*w;
  x.lineWidth=1.5;x.strokeStyle='rgba(255,230,0,.85)';
  [6.35,15.9,99,107,162,170].forEach(v=>{x.beginPath();x.arc(cx,cy,R*v/170,0,7);x.stroke()});
  for(let k=0;k<20;k++){const a=(cfg.rot+9+18*k)*Math.PI/180;x.beginPath();x.moveTo(cx+Math.sin(a)*R*15.9/170,cy-Math.cos(a)*R*15.9/170);x.lineTo(cx+Math.sin(a)*R,cy-Math.cos(a)*R);x.stroke()}
  x.fillStyle='#fff';x.font='bold 12px system-ui';x.textAlign='center';x.textBaseline='middle';
  ORDER.forEach((n,k)=>{const a=(cfg.rot+18*k)*Math.PI/180;x.fillText(n,cx+Math.sin(a)*R*1.09,cy-Math.cos(a)*R*1.09)});
  G.darts.forEach(d=>{const px=d.x*w,py=d.y*h;x.strokeStyle='#ff3b30';x.lineWidth=2.5;x.beginPath();x.moveTo(px-7,py-7);x.lineTo(px+7,py+7);x.moveTo(px+7,py-7);x.lineTo(px-7,py+7);x.stroke();x.fillStyle='#ff3b30';x.fillText(d.label,px,py-14)});
}

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr(e,true)});
cv.addEventListener('pointermove',e=>{if(e.buttons)ptr(e,false)});
function ptr(e,down){
  const r=cv.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;
  if(calib){cfg.x=nx;cfg.y=ny;draw();return}
  if(!down)return;
  if(manual){addDart(hit(nx,ny))}
  else if(G.darts.length){G.darts[G.darts.length-1]=hit(nx,ny);calc();render()}
}
$('rs').oninput=e=>{cfg.r=+e.target.value;draw()};
$('rr').oninput=e=>{cfg.rot=+e.target.value;draw()};
$('bCal').onclick=()=>{calib=!calib;$('cal').style.display=calib?'block':'none';$('bCal').classList.toggle('pri',calib)};
$('bMan').onclick=()=>{manual=!manual;$('bMan').classList.toggle('pri',manual);render()};
$('bArm').onclick=()=>{
  if(armed){armed=false;stopLoop();$('bArm').textContent='Lancer la détection';render();return}
  if(G.darts.length>=3||G.bust||G.win)return;
  calib=false;$('cal').style.display='none';$('bCal').classList.remove('pri');
  armed=true;ref=null;prev=null;st='idle';$('bArm').textContent='Pause';startLoop();render();
};
$('bUndo').onclick=()=>{if(G.darts.length){G.darts.pop();calc();render()}};
$('bNext').onclick=()=>{
  if(G.win){stopLoop();armed=false;$('game').classList.add('hide');$('setup').classList.remove('hide');return}
  G.cur=(G.cur+1)%G.players.length;G.start=G.players[G.cur].rem;G.darts=[];G.bust=false;snap();
  if(stream){armed=true;ref=null;prev=null;st='idle';$('bArm').textContent='Pause';startLoop()}else ref=null;
  render();
};
$('bQuit').onclick=()=>{stopLoop();armed=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('game').classList.add('hide');$('setup').classList.remove('hide')};

/* ---------- détection par différence d’images ---------- */
const FW=160;
function grab(){
  const s=photoMode?$('pimg'):vid,sw=photoMode?s.naturalWidth:s.videoWidth,sh=photoMode?s.naturalHeight:s.videoHeight;
  if(!sw)return null;
  const FH=Math.round(FW*sh/sw);
  off.width=FW;off.height=FH;
  const c=off.getContext('2d',{willReadFrequently:true});c.drawImage(s,0,0,FW,FH);
  const d=c.getImageData(0,0,FW,FH).data,g=new Uint8Array(FW*FH);
  for(let i=0;i<g.length;i++)g[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);
  return{g,FH};
}
function inBoard(i,FH){
  const px=i%FW,py=(i/FW)|0,dx=px-cfg.x*FW,dy=py-cfg.y*FH,R=cfg.r*FW*1.05;
  return dx*dx+dy*dy<R*R;
}
function diff(a,b,collect){
  let n=0,N=0;const pts=[];
  for(let i=0;i<a.g.length;i++){
    if(!inBoard(i,a.FH))continue;N++;
    if(Math.abs(a.g[i]-b.g[i])>35){n++;if(collect)pts.push(i)}
  }
  return{n,N,pts};
}
function tick(){
  if(!armed)return;const f=grab();if(!f)return;
  if(!ref){ref=f;prev=f;return}
  const dr=diff(f,ref,false),dp=diff(f,prev,false);prev=f;
  if(st=='idle'){if(dr.n>8){st='busy';still=0}return}
  still=dp.n<=3?still+1:0;
  if(still>=4){
    if(dr.n>dr.N*0.2)return; // main encore devant la cible
    st='idle';
    if(dr.n>8)fromDiff(f,ref);
    ref=f;
  }
}
function fromDiff(f,r){
  const {pts}=diff(f,r,true);if(!pts.length)return;
  const FH=f.FH;
  let P=pts.map(i=>[i%FW,(i/FW)|0]);
  let mx=P.reduce((s,p)=>s+p[0],0)/P.length,my=P.reduce((s,p)=>s+p[1],0)/P.length;
  P=P.filter(p=>Math.hypot(p[0]-mx,p[1]-my)<14);if(!P.length)return;
  mx=P.reduce((s,p)=>s+p[0],0)/P.length;my=P.reduce((s,p)=>s+p[1],0)/P.length;
  const bx=cfg.x*FW,by=cfg.y*FH;
  P.sort((a,b)=>Math.hypot(a[0]-bx,a[1]-by)-Math.hypot(b[0]-bx,b[1]-by));
  const k=P.slice(0,Math.max(1,Math.ceil(P.length*.3)));
  const tx=k.reduce((s,p)=>s+p[0],0)/k.length,ty=k.reduce((s,p)=>s+p[1],0)/k.length;
  addDart(hit((tx+.5)/FW,(ty+.5)/FH));
}
$('addP').onclick=()=>{const n=document.querySelectorAll('#setup input[type=text]').length;if(n>=12)return;const i=document.createElement('input');i.type='text';i.placeholder='Joueur '+(n+1)+' (optionnel)';$('more').appendChild(i);i.focus();if(n+1>=12)$('addP').style.display='none'};
$('bPhoto').onclick=()=>$('fPhoto').click();
$('fPhoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=$('pimg');
  im.onload=()=>{photoMode=true;vid.style.display='none';im.style.display='block';
    const r=im.naturalWidth/im.naturalHeight;wrap.style.aspectRatio=r;wrap.style.width='min(100%,'+(52*r)+'vh)';draw();
    const g=grab();if(!g)return;
    if(!ref){ref=g;camErr='Photo de référence prise. Lancez, puis reprenez une photo sans bouger le téléphone.';render();return}
    camErr='';fromDiff(g,ref);ref=g;render()};
  im.src=URL.createObjectURL(f);e.target.value=''};
function startLoop(){stopLoop();timer=setInterval(tick,250)}
function stopLoop(){if(timer){clearInterval(timer);timer=null}}
</script></body></html>
